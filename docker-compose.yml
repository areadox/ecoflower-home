services:
  ecoflower-home:
    build: .
    image: localhost/ecoflower-home:0.0.7
    container_name: ecoflower-home
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
      WEB_USER: admin
      WEB_PASSWORD: bitte-aendern
      RUST_LOG: info
    volumes:
      - ./data:/data
