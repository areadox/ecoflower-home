name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: ecoflower-home-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            asset: ecoflower-home-linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Zig und cargo-zigbuild installieren
        run: pip install ziglang cargo-zigbuild
      - name: Tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked
      - name: Bauen (glibc 2.28 für breite Kompatibilität)
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28
      - name: Paket vorbereiten
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/ecoflower-home dist/${{ matrix.asset }}
          cd dist && sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          name: ecoflower-home ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*
