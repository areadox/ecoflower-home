name: Release

# Läuft bei jedem Push auf main (außer reinen Doku-Änderungen) oder manuell.
# Die Versionsnummer kommt aus Cargo.toml: Das Release „v<Version>“ wird angelegt
# bzw. mit den neuen Programmdateien aktualisiert.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: ecoflower-home-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            asset: ecoflower-home-linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Zig und cargo-zigbuild installieren
        run: pip install ziglang cargo-zigbuild
      - name: Tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked
      - name: Bauen (glibc 2.28 für breite Kompatibilität)
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28
      - name: Paket vorbereiten
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/ecoflower-home dist/${{ matrix.asset }}
          cd dist && sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version aus Cargo.toml lesen
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Release erstellen oder aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ecoflower-home ${{ steps.version.outputs.version }}
          body_path: .github/release-notes.md
          files: dist/*
          overwrite_files: true
